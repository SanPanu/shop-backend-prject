<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Practice Shop</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231a56f0'/%3E%3Cpath d='M9 13h14l-1 12H10z' fill='none' stroke='white' stroke-width='2.2' stroke-linejoin='round'/%3E%3Cpath d='M12.5 13v-2a3.5 3.5 0 0 1 7 0v2' fill='none' stroke='white' stroke-width='2.2' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
  :root {
    --blue:#1a56f0; --blue-d:#0f3fc4; --blue-soft:#e8efff; --ink:#111827; --muted:#6b7280; --line:#e5e7eb;
    --bg:#f3f5f9; --card:#fff; --bad:#c0271a; --good:#0a7d4b; --yellow:#ffd21f; --star:#f5a400;
  }
  * { box-sizing:border-box; }
  body { margin:0; font:15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color:var(--ink); background:var(--bg); }
  a { color:var(--blue); text-decoration:none; }
  svg { flex:none; }
  .wrap { max-width:1280px; margin:0 auto; padding:0 16px; }

  /* header */
  header { background:var(--card); border-bottom:1px solid var(--line); }
  .top { display:flex; align-items:center; gap:14px; padding:14px 0; flex-wrap:wrap; }
  .logo { display:flex; align-items:center; gap:8px; font-size:22px; font-weight:800; color:var(--blue-d); letter-spacing:-.3px; }
  .logo .mark { background:var(--blue); color:#fff; border-radius:9px; padding:5px; display:flex; }
  .search { flex:1 1 260px; display:flex; align-items:center; gap:8px; background:#f1f3f7; border:1px solid var(--line); border-radius:999px; padding:0 14px; color:var(--muted); min-width:0; }
  .search input { flex:1; border:0; background:transparent; padding:10px 0; font:inherit; outline:none; min-width:0; }
  .search:focus-within { border-color:var(--blue); background:#fff; }
  .hlink { display:flex; align-items:center; gap:7px; color:var(--ink); font-weight:600; white-space:nowrap; }
  .hlink .badge { background:var(--blue); color:#fff; border-radius:999px; font-size:12px; min-width:20px; height:20px; display:inline-flex; align-items:center; justify-content:center; padding:0 6px; }
  #account { display:flex; align-items:center; gap:10px; }

  .cats { display:flex; gap:6px; overflow-x:auto; scrollbar-width:none; border-top:1px solid var(--line); }
  .cats::-webkit-scrollbar { display:none; }
  .cats a { flex:1 0 auto; min-width:84px; display:flex; flex-direction:column; align-items:center; gap:5px; padding:12px 10px 9px; color:var(--ink); font-size:13px; font-weight:500; border-bottom:3px solid transparent; }
  .cats a:hover { color:var(--blue); }
  .cats a.active { color:var(--blue); font-weight:700; border-bottom-color:var(--blue); }

  main.wrap { padding-top:20px; padding-bottom:40px; }
  h1 { font-size:24px; margin:4px 0 16px; letter-spacing:-.2px; }
  h2 { font-size:17px; margin:0; }

  /* controls */
  button, .btn { font:inherit; font-weight:600; padding:8px 14px; border:1px solid var(--blue); background:var(--blue); color:#fff; border-radius:8px; cursor:pointer; display:inline-flex; align-items:center; justify-content:center; gap:6px; }
  button:hover:not(:disabled) { background:var(--blue-d); }
  button.secondary { background:#fff; color:var(--blue); }
  button.secondary:hover:not(:disabled) { background:var(--blue-soft); }
  button.danger { background:#fff; color:var(--bad); border-color:var(--bad); }
  button.danger:hover:not(:disabled) { background:#fdecea; }
  button:disabled { opacity:.45; cursor:not-allowed; }
  input, select { font:inherit; padding:8px 10px; border:1px solid var(--line); border-radius:8px; background:#fff; max-width:100%; }
  input:focus, select:focus { outline:2px solid var(--blue-soft); border-color:var(--blue); }
  label { display:flex; flex-direction:column; gap:4px; font-size:13px; color:var(--muted); }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px; }
  .muted { color:var(--muted); font-size:13px; }
  .out { color:var(--bad); font-size:13px; } .in { color:var(--good); font-size:13px; }
  .row { display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
  .stack { display:flex; flex-direction:column; gap:12px; }
  .two { display:grid; grid-template-columns:repeat(auto-fit, minmax(260px, 1fr)); gap:16px; }

  #message { margin:0 0 14px; padding:10px 14px; border-radius:8px; display:none; font-weight:500; }
  #message.error { display:block; background:#fef3f2; color:var(--bad); border:1px solid #fecdca; }
  #message.success { display:block; background:#ecfdf3; color:var(--good); border:1px solid #abefc6; }

  /* banners */
  .carousel { position:relative; }
  .track { display:flex; gap:18px; overflow-x:auto; scroll-snap-type:x mandatory; scrollbar-width:none; }
  .track::-webkit-scrollbar { display:none; }
  .banner { flex:0 0 calc((100% - 36px) / 3); scroll-snap-align:start; min-height:230px; border-radius:16px; padding:26px 28px; color:#fff; position:relative; overflow:hidden; display:flex; flex-direction:column; align-items:flex-start; justify-content:center; gap:6px; }
  .banner h3 { margin:0; font-size:30px; line-height:1.08; font-weight:800; letter-spacing:-.5px; max-width:70%; }
  .banner h3 em { font-style:normal; color:var(--yellow); }
  .banner p { margin:2px 0 10px; max-width:62%; opacity:.95; }
  .banner .art { position:absolute; right:-14px; bottom:-18px; opacity:.28; transform:rotate(-10deg); }
  .banner .btn { background:#fff; color:var(--ink); border-color:#fff; border-radius:999px; padding:8px 18px; position:relative; }
  .b1 { background:linear-gradient(120deg,#0f3fc4,#1a6df5 60%,#f0b400 60.2%,#ffd21f); }
  .b2 { background:linear-gradient(120deg,#3b46e6,#6a5cf2); }
  .b3 { background:linear-gradient(120deg,#0a6b4a,#17a673); }
  .b4 { background:linear-gradient(120deg,#b0306a,#e8553e); }
  .arrow { position:absolute; top:50%; transform:translateY(-50%); width:40px; height:40px; padding:0; border-radius:50%; background:#fff; color:var(--blue-d); border:1px solid var(--line); box-shadow:0 2px 8px rgba(16,24,40,.14); z-index:2; }
  .arrow:hover:not(:disabled) { background:var(--blue-soft); }
  .arrow.prev { left:-20px; } .arrow.next { right:-20px; }
  .dots { display:flex; justify-content:center; gap:7px; margin:12px 0 0; }
  .dots button { width:8px; height:8px; padding:0; border-radius:50%; border:0; background:#c9cfdb; }
  .dots button.on { background:var(--blue); }

  /* product strips */
  .strip { margin-top:26px; border-radius:18px; padding:24px 26px 26px; background:var(--card); border:1px solid var(--line); }
  .strip.deals { background:linear-gradient(115deg,#1d4ff0,#2f3fe0 55%,#4a34d6); border:0; color:#fff; }
  .strip-head { display:flex; align-items:center; gap:14px; margin-bottom:18px; flex-wrap:wrap; }
  .strip-head .ico { width:46px; height:46px; border-radius:50%; background:rgba(255,255,255,.24); display:flex; align-items:center; justify-content:center; }
  .strip:not(.deals) .strip-head .ico { background:var(--blue-soft); color:var(--blue); }
  .strip-head h2 { font-size:24px; letter-spacing:-.3px; }
  .strip-head p { margin:2px 0 0; opacity:.9; font-size:14px; }
  .strip-head .viewall { margin-left:auto; border-radius:999px; background:transparent; border:1.5px solid currentColor; color:inherit; padding:8px 18px; font-weight:600; }
  .strip:not(.deals) .viewall { color:var(--blue); }
  .strip .track { gap:14px; }
  .strip .pcard { flex:0 0 212px; scroll-snap-align:start; }

  .pcard { background:#fff; color:var(--ink); border:1px solid var(--line); border-radius:12px; padding:14px; display:flex; flex-direction:column; gap:5px; position:relative; }
  .off { position:absolute; top:10px; left:10px; background:var(--blue-soft); color:var(--blue-d); font-size:11px; font-weight:700; padding:3px 8px; border-radius:999px; z-index:1; }
  .pimg { height:140px; border-radius:10px; display:flex; align-items:center; justify-content:center; margin-bottom:4px; background:#eef2ff; color:#3b5bdb; }
  .pimg img { max-width:100%; max-height:100%; object-fit:contain; }
  .pimg.big { height:320px; }
  .c-fashion { background:#fff0f6; color:#c2255c; } .c-mobiles { background:#f1f3f5; color:#343a40; }
  .c-electronics { background:#eef2ff; color:#3b5bdb; } .c-beauty { background:#fff0f3; color:#e03171; }
  .c-home { background:#fff8e6; color:#b7791f; } .c-appliances { background:#e6fcf5; color:#0b7285; }
  .c-toys { background:#fff4e6; color:#d9480f; } .c-food { background:#ebfbee; color:#2b8a3e; }
  .c-sports { background:#e7f5ff; color:#1864ab; } .c-books { background:#f3f0ff; color:#5f3dc4; }
  .pname { font-weight:700; color:var(--ink); }
  .pname:hover { color:var(--blue); }
  .rating { font-size:13px; font-weight:600; } .rating .star { color:var(--star); }
  .prices { display:flex; align-items:baseline; gap:8px; flex-wrap:wrap; margin-top:2px; }
  .prices b { font-size:19px; color:var(--blue-d); } .prices s { color:#9aa1ad; font-size:13px; }
  .pcard button { margin-top:auto; }
  .pcard .in, .pcard .out { margin-bottom:6px; }

  /* listing */
  .listing { display:grid; grid-template-columns:240px 1fr; gap:18px; align-items:start; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(200px, 1fr)); gap:14px; }
  .filters { display:flex; flex-direction:column; gap:12px; }
  .filters input, .filters select { width:100%; }

  /* detail */
  .detail { display:grid; grid-template-columns:minmax(0, 420px) 1fr; gap:28px; }
  .detail h1 { margin:6px 0 4px; }
  .detail .prices b { font-size:28px; }
  .tag { display:inline-block; background:var(--blue-soft); color:var(--blue-d); font-size:12px; font-weight:700; padding:3px 9px; border-radius:999px; }

  /* tables */
  .tablewrap { overflow-x:auto; background:var(--card); border:1px solid var(--line); border-radius:12px; }
  table { width:100%; border-collapse:collapse; }
  th, td { text-align:left; padding:11px 14px; border-bottom:1px solid var(--line); white-space:nowrap; }
  th { font-size:13px; color:var(--muted); font-weight:600; background:#fafbfc; }
  tr:last-child td { border-bottom:0; }
  td.num, th.num { text-align:right; font-variant-numeric:tabular-nums; }
  .totals { margin:14px 0; display:grid; grid-template-columns:auto auto; gap:5px 28px; justify-content:end; font-variant-numeric:tabular-nums; }
  .totals span:nth-child(even) { text-align:right; }
  .totals .grand { font-weight:800; font-size:18px; }

  /* login and sign up */
  .auth { display:grid; grid-template-columns:1fr 1fr; gap:28px; align-items:stretch; }
  .auth-side { border-radius:18px; padding:40px 40px 0; background:radial-gradient(circle at 0 20%, #a9c8ff 0 90px, transparent 91px), radial-gradient(circle at 100% 0, #a9c8ff 0 110px, transparent 111px), linear-gradient(170deg,#dbe9ff,#bcd6ff 60%,#8fb6ff); display:flex; flex-direction:column; gap:14px; overflow:hidden; color:#0b1f4d; }
  .auth-side .hello { font-style:italic; font-size:22px; color:var(--blue); }
  .auth-side h2 { font-size:32px; line-height:1.15; letter-spacing:-.5px; }
  .auth-side > p { margin:0; font-size:17px; color:#40507a; max-width:30em; }
  .perk { display:flex; gap:14px; align-items:center; }
  .perk .ico { width:46px; height:46px; border-radius:50%; background:rgba(26,86,240,.16); color:var(--blue-d); display:flex; align-items:center; justify-content:center; }
  .perk b { display:block; } .perk span span { font-size:13px; color:#40507a; }
  .auth-art { margin-top:auto; padding-top:20px; display:flex; align-items:flex-end; gap:14px; }
  .auth-art .bagtile { width:170px; height:190px; border-radius:10px 10px 0 0; background:linear-gradient(160deg,#1a6df5,#0f3fc4); color:#fff; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px; font-weight:800; }
  .auth-art .tile { width:120px; height:110px; border-radius:10px 10px 0 0; background:#d9a86c; color:#6b4a1f; display:flex; align-items:center; justify-content:center; }
  .auth-art .tile.t2 { height:140px; background:#1c2f6b; color:#c9d8ff; }
  .auth-card { border-radius:18px; padding:36px 40px; align-self:center; width:100%; max-width:560px; justify-self:center; }
  .auth-card h1 { font-size:30px; margin:0 0 6px; } .auth-card h1 em { font-style:normal; color:var(--blue); }
  .auth-card .lead { color:var(--muted); margin:0 0 22px; font-size:16px; }
  .auth-card label { font-size:14px; font-weight:700; color:var(--ink); gap:8px; }
  .field { display:flex; align-items:center; gap:10px; border:1px solid var(--line); border-radius:10px; padding:0 14px; background:#fff; color:var(--muted); }
  .field:focus-within { border-color:var(--blue); outline:2px solid var(--blue-soft); }
  .field input { flex:1; border:0; outline:0; padding:13px 0; min-width:0; font-weight:400; }
  .field input:focus { outline:0; }
  .field button { background:none; border:0; color:var(--muted); padding:4px; }
  .field button:hover:not(:disabled) { background:none; color:var(--blue); }
  .auth-card .submit { padding:14px; font-size:16px; border-radius:10px; width:100%; }
  .check { flex-direction:row; align-items:center; font-weight:400 !important; color:var(--ink); }
  .check input { width:18px; height:18px; accent-color:var(--blue); }
  .meter { display:flex; align-items:center; gap:6px; font-size:13px; color:var(--muted); font-weight:400; }
  .meter i { width:34px; height:4px; border-radius:2px; background:var(--line); }
  .meter.weak i.on { background:#e03131; } .meter.medium i.on { background:#f59f00; } .meter.strong i.on { background:#2f9e44; }
  .meter.weak b { color:#c92a2a; } .meter.medium b { color:#b7791f; } .meter.strong b { color:#2b8a3e; }
  .switch { text-align:center; color:var(--muted); margin:0; }
  .switch a { font-weight:700; }

  /* shared look for the inner pages, taken from the home and login pages */
  body { background:linear-gradient(180deg,#e6eeff 0,#f3f5f9 460px) no-repeat, var(--bg); }
  body { min-height:100vh; display:flex; flex-direction:column; } main.wrap { flex:1; width:100%; }
  header::before { content:""; display:block; height:4px; background:linear-gradient(90deg,#1d4ff0,#4a34d6 70%,#ffd21f); }
  .hero { position:relative; overflow:hidden; border-radius:18px; padding:24px 28px; margin-bottom:20px; color:#fff;
          background:linear-gradient(115deg,#1d4ff0,#2f3fe0 55%,#4a34d6); display:flex; align-items:center; gap:16px; flex-wrap:wrap; }
  .hero .art { position:absolute; right:22%; bottom:-34px; opacity:.16; transform:rotate(-10deg); pointer-events:none; }
  .hero .ico { width:48px; height:48px; border-radius:50%; background:rgba(255,255,255,.24); display:flex; align-items:center; justify-content:center; flex:none; }
  .hero h1 { margin:0; font-size:28px; color:#fff; letter-spacing:-.4px; }
  .hero p { margin:3px 0 0; opacity:.92; }
  .hero .grow { flex:1; min-width:0; position:relative; }
  .hero .side { position:relative; display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  .hero .btn { background:#fff; color:var(--ink); border-color:#fff; border-radius:999px; padding:8px 18px; }
  .hero .hchip { background:rgba(255,255,255,.2); border-radius:999px; padding:5px 14px; font-weight:700; font-size:13px; }
  .crumbs { display:flex; gap:8px; align-items:center; flex-wrap:wrap; font-size:13px; color:var(--muted); margin:0 0 12px; }
  .crumbs a { font-weight:600; }
  .card, .tablewrap { border-color:#e1e8f7; box-shadow:0 1px 2px rgba(16,24,40,.04), 0 10px 28px rgba(26,86,240,.07); }
  th { background:var(--blue-soft); color:var(--blue-d); }
  tbody tr:hover td { background:#f8faff; }
  .pcard { transition:transform .15s ease, box-shadow .15s ease; }
  .pcard:hover { transform:translateY(-3px); box-shadow:0 12px 26px rgba(26,86,240,.14); }
  @media (prefers-reduced-motion: reduce) { .pcard { transition:none; } .pcard:hover { transform:none; } }
  .pill { display:inline-block; padding:3px 12px; border-radius:999px; font-size:12px; font-weight:700; background:var(--blue-soft); color:var(--blue-d); }
  .pill.paid { background:#e3f6ec; color:var(--good); } .pill.cancelled { background:#fdecea; color:var(--bad); }
  .empty { display:flex; flex-direction:column; align-items:center; gap:12px; text-align:center; padding:46px 20px; font-size:16px; }
  .empty .ico { width:84px; height:84px; border-radius:50%; background:var(--blue-soft); color:var(--blue); display:flex; align-items:center; justify-content:center; }
  .empty .btn { border-radius:999px; padding:10px 22px; color:#fff; }
  .totals { background:#fff; border:1px solid #e1e8f7; border-radius:14px; padding:16px 22px; width:fit-content; max-width:100%; margin-left:auto;
            box-shadow:0 10px 28px rgba(26,86,240,.07); }
  .totals .grand { color:var(--blue-d); padding-top:8px; border-top:1px solid var(--line); margin-top:4px; }
  .filters h2 { display:flex; align-items:center; gap:8px; color:var(--blue-d); }
  .detail .pimg.big { background-image:radial-gradient(circle at 85% 12%, rgba(255,255,255,.75) 0 70px, transparent 71px); }
  .perks { display:flex; gap:10px; flex-wrap:wrap; }
  .perks span { display:inline-flex; align-items:center; gap:7px; background:var(--blue-soft); color:var(--blue-d); border-radius:999px; padding:6px 14px; font-size:13px; font-weight:600; }
  .co-form { background:#fff; border:1px solid #e1e8f7; border-radius:16px; padding:24px; box-shadow:0 10px 28px rgba(26,86,240,.07); }
  .co-form h2:first-child { margin-top:0; }
  .fbox { background:#fbfcff; }
  .steps { background:#fff; border:1px solid #e1e8f7; border-radius:999px; padding:10px 18px; width:fit-content; max-width:100%; }
  footer { border-top:0; background:linear-gradient(115deg,#0b1f4d,#16307e); color:#c9d6f5; padding:26px 0 30px; text-align:left; }
  footer .foot { display:flex; gap:18px 40px; flex-wrap:wrap; align-items:center; justify-content:space-between; }
  footer .logo { color:#fff; font-size:19px; } footer p { margin:6px 0 0; max-width:34em; }
  footer nav { display:flex; gap:18px; flex-wrap:wrap; } footer nav a { color:#fff; font-weight:600; }

  /* field-level validation messages */
  .ferr { display:block; color:var(--bad); font-size:13px; font-weight:500; line-height:1.35; margin-top:5px; text-transform:none; letter-spacing:0; white-space:normal; text-align:left; }
  .ferr::before { content:"!"; display:inline-flex; align-items:center; justify-content:center; width:15px; height:15px; margin-right:6px; border-radius:50%;
                  background:var(--bad); color:#fff; font-size:11px; font-weight:800; vertical-align:1px; }
  input.invalid, select.invalid { border-color:var(--bad) !important; }
  .field.invalid, .fbox.invalid { border-color:var(--bad); outline:2px solid #fde3e0; }
  .field.invalid input.invalid, .fbox.invalid input.invalid, .fbox.invalid select.invalid { border:0 !important; }
  .fcol { display:flex; flex-direction:column; min-width:0; }
  td .ferr { max-width:220px; }

  /* filter panel */
  .card.filters { padding:0; gap:0; overflow:hidden; position:sticky; top:12px; }
  .f-head { display:flex; align-items:center; justify-content:space-between; gap:10px; padding:14px 16px; background:var(--blue-soft); }
  .f-head h2 { font-size:16px; margin:0; }
  .f-head a { font-size:13px; font-weight:600; }
  .f-toggle { display:none; }
  .f-body { padding:2px 16px 16px; display:flex; flex-direction:column; }
  .f-group { padding:14px 0; border-bottom:1px solid var(--line); display:flex; flex-direction:column; gap:8px; }
  .f-group > label, .f-label { display:block; font-size:12px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); }
  .filters input, .filters select, .sortbox select {
    height:42px; width:100%; padding:0 12px; border:1px solid #d5dcea; border-radius:10px; background-color:#fff; font-size:14px; color:var(--ink); margin:0; }
  .filters select, .sortbox select { appearance:none; -webkit-appearance:none; padding-right:34px; background-repeat:no-repeat; background-position:right 12px center;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='8' viewBox='0 0 12 8'><path d='M1 1.5l5 5 5-5' fill='none' stroke='%23667085' stroke-width='1.8' stroke-linecap='round' stroke-linejoin='round'/></svg>"); }
  .filters input[type=number] { -moz-appearance:textfield; }
  .filters input[type=number]::-webkit-outer-spin-button, .filters input[type=number]::-webkit-inner-spin-button { -webkit-appearance:none; margin:0; }
  .f-range { display:grid; grid-template-columns:minmax(0,1fr) auto minmax(0,1fr); gap:8px; align-items:center; color:var(--muted); font-size:13px; }
  .f-chips { display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:6px; }
  .f-chips button { background:#fff; color:var(--ink); border:1px solid #d5dcea; border-radius:999px; padding:6px 2px; font-size:12px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; letter-spacing:-.1px; }
  .f-chips button:hover:not(:disabled) { background:var(--blue-soft); border-color:var(--blue); }
  .f-chips button.on, .f-chips button.on:hover { background:var(--blue); color:#fff; border-color:var(--blue); }

function route() {
  const [path, qs] = location.hash.replace(/^#\/?/, '').split('?');
  return { parts: path.split('/'), params: new URLSearchParams(qs || '') };
}
function go(hash) { if (location.hash === hash) render(); else location.hash = hash; }

async function refreshNav() {
  const { parts, params } = route();
  const current = parts[0] === '' ? '/' : parts[0] === 'list' ? (params.get('category') || '') : null;
  if (!categories.length) { try { categories = await api('GET', '/categories'); } catch {} }
  $('#cats').innerHTML =
    `<a href="#/" data-testid="cat-for-you" class="${current === '/' ? 'active' : ''}">${svg('home', 26)}For You</a>` +
    categories.map(c => `<a href="#/list?category=${esc(c.slug)}" data-testid="cat-${esc(c.slug)}" class="${current === c.slug ? 'active' : ''}">${svg(c.icon, 26)}${esc(c.name)}</a>`).join('');
  let count = 0;
  if (store.token) { try { count = (await api('GET', '/cart')).items.reduce((n, i) => n + i.quantity, 0); } catch {} }
  $('[data-testid=cart-count]').textContent = count;
  $('#account').innerHTML = store.token
    ? `<span class="hlink">${svg('user', 20, 1.9)}<span data-testid="user-name">${esc(store.name)}</span></span><button class="secondary" data-action="logout" data-testid="logout">Log out</button>`
    : `<a class="hlink" href="#/login" data-testid="nav-login">${svg('user', 20, 1.9)}Login / Sign Up</a>`;
}

function needLogin() {
  if (store.token) return false;
  returnTo = location.hash;
  flash = { text: 'Please log in first.', kind: 'error' };
  go('#/login');
  return true;
}

const stock = p => p.in_stock ? p.stock + ' in stock' : 'Out of stock';
const card = p => `
  <div class="pcard" data-testid="product-${p.id}">
    ${p.discount_percent ? `<span class="off" data-testid="product-discount">${p.discount_percent}% OFF</span>` : ''}
    <a class="pimg c-${esc(p.category)}" href="#/p/${p.id}" aria-label="${esc(p.name)}" data-testid="product-image">${pic(p, 84)}</a>
    <a class="pname" href="#/p/${p.id}" data-testid="product-name">${esc(p.name)}</a>
    <span class="muted">${esc(p.specs)}</span>

async function showList(params) {
  const cat = categories.find(c => c.slug === params.get('category'));
  const q = params.get('q') || '';
  const title = cat ? cat.name : q ? `Results for “${q}”` : 'All products';
  setTitle(title);
  const opt = (v, label, cur) => `<option value="${esc(v)}" ${v === (cur || '') ? 'selected' : ''}>${esc(label)}</option>`;
  // The filters in force, shown as removable tags above the results: [label, parameters to drop when removed]
  const chips = [];
  if (q) chips.push([`Search: ${q}`, ['q']]);
  if (cat) chips.push([cat.name, ['category']]);
  const lo = params.get('min_price'), hi = params.get('max_price');
  if (lo || hi) chips.push([lo && hi ? `${rupee(lo)} to ${rupee(hi)}` : lo ? `${rupee(lo)} and above` : `Up to ${rupee(hi)}`, ['min_price', 'max_price']]);
  if (params.get('in_stock')) chips.push([params.get('in_stock') === 'true' ? 'In stock only' : 'Out of stock', ['in_stock']]);
  view.innerHTML = `
    ${hero(cat ? cat.icon : q ? 'search' : 'bag', `<h1 data-testid="list-title">${esc(title)}</h1>`,
           cat ? `Everything in ${esc(cat.name)}, with today's prices and stock.` : q ? 'Products whose name matches your search.' : 'The whole catalogue. Use the filters to narrow it down.',
           cat || q ? `<a class="btn" href="#/list" data-testid="hero-all">All products</a>` : '')}
    <div class="listing">
      <form class="card filters ${filtersOpen === false || (filtersOpen === null && window.innerWidth <= 760 && !chips.length) ? 'closed' : ''}" id="filters" data-testid="filters" novalidate>
        <div class="f-head">
          <h2>${svg('search', 18, 2)} Filters</h2>
          <span class="row" style="gap:10px">
            ${chips.length ? `<a href="#/list" data-testid="filter-clear">Clear all</a>` : `<a href="#/list" data-testid="filter-clear" hidden>Clear all</a>`}
            <button type="button" class="f-toggle secondary" data-action="filters-toggle" data-testid="filters-toggle">Show / hide</button>
          </span>
        </div>
        <div class="f-body">
          <div class="f-group">
            <label for="f-q">Search</label>
            <input id="f-q" name="q" data-testid="filter-search" placeholder="e.g. running" value="${esc(q)}">
          </div>
          <div class="f-group">
            <label for="f-cat">Category</label>
            <select id="f-cat" name="category" data-auto data-testid="filter-category">${opt('', 'All categories', params.get('category'))}${categories.map(c => opt(c.slug, c.name, params.get('category'))).join('')}</select>
          </div>
          <div class="f-group" data-err-host>
            <span class="f-label" id="f-price-label">Price (₹)</span>
            <div class="f-range" role="group" aria-labelledby="f-price-label">
              <input name="min_price" type="number" min="0" inputmode="numeric" placeholder="Min" aria-label="Minimum price" data-testid="filter-min-price" value="${esc(params.get('min_price') || '')}">
              <span>to</span>
              <input name="max_price" type="number" min="0" inputmode="numeric" placeholder="Max" aria-label="Maximum price" data-testid="filter-max-price" value="${esc(params.get('max_price') || '')}">
            </div>
            <div class="f-chips">${PRICE_BANDS.map(([label, lo, hi], i) => `<button type="button" data-action="price" data-min="${lo}" data-max="${hi}" data-testid="price-chip-${i + 1}"
              class="${(params.get('min_price') || '') === lo && (params.get('max_price') || '') === hi ? 'on' : ''}">${label}</button>`).join('')}</div>
          </div>
          <div class="f-group" style="border-bottom:0;padding-bottom:0">
            <label for="f-stock">Availability</label>
            <select id="f-stock" name="in_stock" data-auto data-testid="filter-stock">
              ${[['', 'All products'], ['true', 'In stock only'], ['false', 'Out of stock']].map(([v, l]) => opt(v, l, params.get('in_stock'))).join('')}
            </select>
          </div>
          <button class="f-apply" data-testid="filter-apply">Apply filters</button>
        </div>
      </form>
      <div>
        <div class="toolbar">
          <p data-testid="result-count"></p>
          <label class="sortbox">Sort by
            <select name="sort" form="filters" data-auto data-testid="filter-sort">
              ${[['', 'Featured'], ['price_asc', 'Price: low to high'], ['price_desc', 'Price: high to low'], ['discount', 'Biggest discount'], ['rating', 'Top rated'], ['name', 'Name: A to Z']].map(([v, l]) => opt(v, l, params.get('sort'))).join('')}
            </select>
          </label>
        </div>
        ${chips.length ? `<div class="active" data-testid="active-filters">${chips.map(([label, keys]) => {
          const rest = new URLSearchParams(params); keys.forEach(k => rest.delete(k));
          return `<a href="#/list${rest.toString() ? '?' + rest : ''}" data-testid="active-chip-${keys[0] === 'min_price' ? 'price' : keys[0]}" aria-label="Remove filter: ${esc(label)}">${esc(label)}<span aria-hidden="true">×</span></a>`;
        }).join('')}</div>` : ''}

      </div>
    </div>`;
  const products = await api('GET', '/products?' + params);
  $('[data-testid=result-count]').textContent = `${products.length} product${products.length === 1 ? '' : 's'}`;
  $('#grid').innerHTML = products.map(card).join('') || '<p data-testid="no-results">No products match these filters.</p>';

async function showCart() {
  if (needLogin()) return;
  setTitle('Cart');
  const cart = await api('GET', '/cart');
  if (!cart.items.length) {
    setCoupon(null);
    view.innerHTML = hero('cart', '<h1>Cart</h1>', 'Nothing here yet.') + empty('cart', 'cart-empty', 'Your cart is empty.', 'Browse products', '#/');
    return;
  }
  let discount = 0;
  if (appliedCoupon) {
    try { discount = (await api('POST', '/coupons/validate', { code: appliedCoupon })).discount; }
    catch (e) { say(`Coupon ${appliedCoupon} removed: ${e.message}`); setCoupon(null); }
  }
  view.innerHTML = `
    ${hero('cart', '<h1>Cart</h1>', 'Check quantities, add a coupon, then proceed to checkout.',
           `<span class="hchip" data-testid="cart-units">${cart.items.reduce((n, i) => n + i.quantity, 0)} item(s)</span>`)}
    <div class="tablewrap"><table data-testid="cart-table">
      <thead><tr><th>Product</th><th class="num">Price</th><th>Quantity</th><th class="num">Total</th><th></th></tr></thead>
      <tbody>${cart.items.map(i => `
        <tr data-testid="cart-row-${i.product_id}">
          <td><a href="#/p/${i.product_id}">${esc(i.name)}</a></td>
          <td class="num">${rupee(i.unit_price)}</td>
          <td><input type="number" min="1" value="${i.quantity}" data-prev="${i.quantity}" style="width:76px" data-action="qty" data-id="${i.product_id}" data-testid="cart-qty" aria-label="Quantity"></td>
          <td class="num" data-testid="cart-line-total">${rupee(i.line_total)}</td>
          <td><button class="danger" data-action="remove" data-id="${i.product_id}" data-testid="cart-remove">Remove</button></td>
        </tr>`).join('')}</tbody>
    </table></div>
    <div class="totals">
      <span>Subtotal</span><span data-testid="cart-subtotal">${rupee(cart.subtotal)}</span>
      <span>Discount${appliedCoupon ? ' (' + esc(appliedCoupon) + ')' : ''}</span><span data-testid="cart-discount">−${rupee(discount)}</span>
      <span class="grand">Total</span><span class="grand" data-testid="cart-total">${rupee(cart.subtotal - discount)}</span>
    </div>
    <div class="two">
      <form class="card stack" id="coupon-form">
        <h2>Coupon</h2>
        <label>Code <input name="code" data-testid="coupon-code" value="${esc(appliedCoupon || '')}"></label>
        <div class="row">
          <button class="secondary" data-testid="coupon-apply">Apply</button>
          ${appliedCoupon ? '<button type="button" class="danger" data-action="coupon-remove" data-testid="coupon-remove">Remove</button>' : ''}
        </div>
      </form>
      <div class="card stack">
        <h2>Ready to order?</h2>
        <p class="muted" style="margin:0">Shipping address and payment come next. Shipping is free.</p>
        <a class="btn" style="padding:12px;font-size:16px" href="#/checkout" data-testid="checkout-start">Proceed to checkout ${svg('arrow', 18, 2)}</a>
      </div>
    </div>`;
}

let co = null, shipOptions = null, filtersOpen = null;
const PRICE_BANDS = [['Under ₹500', '', '499'], ['₹500 – ₹1,999', '500', '1999'], ['₹2,000 – ₹9,999', '2000', '9999'], ['₹10,000 +', '10000', '']];
const SHIP_FIELDS = ['email', 'full_name', 'line1', 'line2', 'city', 'state', 'postal_code', 'country'];
function savedAddress(key, value) {
  try {
    if (value === undefined) return JSON.parse(localStorage.getItem(key) || 'null');
    value ? localStorage.setItem(key, JSON.stringify(value)) : localStorage.removeItem(key);
  } catch {}
  return null;
}

// ---------- chat assistant ----------
let chatId = null, chatBusy = false;
const chatBox = $('#chat-messages');
function chatAdd(kind, text, actions) {
  const d = document.createElement('div');
  d.className = 'msg ' + kind;
  d.dataset.testid = 'chat-msg-' + kind.split(' ')[0];
  d.textContent = text;
  if (actions && actions.length) {
    const c = document.createElement('div');
    c.className = 'chips';
    c.innerHTML = actions.map(a => `<span class="chip ${a.is_error ? 'bad' : ''}" data-testid="chat-action" title="${esc(JSON.stringify(a.input))}">${a.is_error ? '✕' : '✓'} ${esc(a.tool)}</span>`).join('');
    d.appendChild(c);
  }
  chatBox.appendChild(d);
  chatBox.scrollTop = chatBox.scrollHeight;
  return d;
}
function chatReset() {
  chatId = null;
  chatBox.innerHTML = '';
  chatAdd('note', 'Ask me to find products, change your cart, check a coupon or look up an order. I cannot take payment.');
}
async function chatSend(text, form) {
  text = String(text || '').trim();
  if (!text || chatBusy) return;
  if (!store.token) { chatAdd('note bad', 'Please log in to use the assistant.'); return; }
  chatBusy = true;
  form.reset();
  $('[data-testid=chat-send]').disabled = true;
  chatAdd('user', text);
  const pending = chatAdd('pending', 'Thinking…');
  try {
    const body = { message: text };
    if (chatId) body.conversation_id = chatId;
    const r = await api('POST', '/agent/chat', body);
    chatId = r.conversation_id;
    pending.remove();
    chatAdd('agent', r.reply, r.actions);
    if (r.actions.length) await render();  // the page behind the chat shows the same data
  } catch (e) {
    pending.remove();
    chatAdd('note bad', e.expired ? 'Your session has ended. Please log in again.' : e.message);
    if (e.expired) { chatId = null; go('#/login'); }
  } finally {
    chatBusy = false;
    $('[data-testid=chat-send]').disabled = false;
    $('[data-testid=chat-input]').focus();
  }
}
chatReset();

// ---------- search suggestions ----------
const sBox = $('#suggest'), sInput = $('[data-testid=header-search]');
let sSeq = 0, sTimer = null, sIndex = -1;
function closeSuggest() {
  sSeq++;                      // any answer still on its way is ignored
  clearTimeout(sTimer);
  sBox.hidden = true; sBox.innerHTML = ''; sIndex = -1;
  sInput.setAttribute('aria-expanded', 'false');
}
// Show the typed text in bold inside a suggestion, when it appears there.
function mark(text, term) {
  const i = text.toLowerCase().indexOf(term);
  return i < 0 ? esc(text) : esc(text.slice(0, i)) + '<b>' + esc(text.slice(i, i + term.length)) + '</b>' + esc(text.slice(i + term.length));
}
async function loadSuggest() {
  const term = sInput.value.trim().toLowerCase().replace(/\s+/g, ' ');
  const seq = ++sSeq;
  if (term.length < 2) { sBox.hidden = true; sBox.innerHTML = ''; sIndex = -1; sInput.setAttribute('aria-expanded', 'false'); return; }
  let r;
  try { r = await api('GET', '/products/suggest?q=' + encodeURIComponent(term)); } catch { return; }
  if (seq !== sSeq) return;    // the customer has typed more, or left, since this was asked
  const first = term.split(' ')[0];
  const name = c => (categories.find(x => x.slug === c) || { name: c }).name;
  const cats = r.categories.map(c => `
    <a class="s-row" role="option" href="#/list?category=${esc(c.slug)}" data-testid="suggest-category">
      <span class="tile">${svg(c.icon, 20, 1.8)}</span><span class="grow">${mark(c.name, first)}<span class="muted">category</span></span>
      <span class="muted">${c.count} products</span></a>`).join('');
  const prods = r.products.map(p => `
    <a class="s-row" role="option" href="#/p/${p.id}" data-testid="suggest-product" data-id="${p.id}">
      <span class="tile">${/^(\/|https?:)/.test(p.image) ? svg('bag', 20, 1.8) : svg(p.image, 20, 1.8)}</span>
      <span class="grow">${mark(p.name, first)}<span class="muted">in ${esc(name(p.category))}</span></span>
      <span class="price">${rupee(p.price)}</span></a>`).join('');
  sBox.innerHTML = cats || prods
    ? (cats ? '<div class="s-head">Categories</div>' + cats : '') + (prods ? '<div class="s-head">Products</div>' + prods : '') +
      `<a class="s-row s-all" role="option" href="#/list?q=${encodeURIComponent(term)}" data-testid="suggest-all">${svg('search', 18, 2)}
         <span class="grow">See all ${r.total} result${r.total === 1 ? '' : 's'} for “${esc(term)}”</span></a>`
    : `<div class="s-none" data-testid="suggest-empty">No products match “${esc(term)}”.</div>`;
  sIndex = -1;
  sBox.hidden = false;
  sInput.setAttribute('aria-expanded', 'true');
}
sInput.addEventListener('input', () => { clearTimeout(sTimer); sTimer = setTimeout(loadSuggest, 160); });
sInput.addEventListener('focus', () => { if (sInput.value.trim().length >= 2 && sBox.hidden) loadSuggest(); });
sInput.addEventListener('keydown', e => {
  const rows = [...sBox.querySelectorAll('.s-row')];
  if (e.key === 'Escape') { closeSuggest(); return; }
  if (sBox.hidden || !rows.length) return;
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
    e.preventDefault();
    sIndex = (sIndex + (e.key === 'ArrowDown' ? 1 : -1) + rows.length + (sIndex < 0 && e.key === 'ArrowUp' ? 1 : 0)) % rows.length;
    rows.forEach((row, i) => { row.classList.toggle('on', i === sIndex); row.setAttribute('aria-selected', i === sIndex ? 'true' : 'false'); });
    rows[sIndex].scrollIntoView({ block: 'nearest' });
  } else if (e.key === 'Enter' && sIndex >= 0) {
    e.preventDefault();          // open the highlighted suggestion instead of running a plain search
    rows[sIndex].click();
  }
});
sBox.addEventListener('click', e => { if (e.target.closest('.s-row')) { sInput.value = ''; closeSuggest(); } });
document.addEventListener('click', e => { if (!e.target.closest('#search-form')) closeSuggest(); });

// ---------- routing and events ----------
// Renders run one after another, so a slow earlier render can never overwrite a newer page.
let renderChain = Promise.resolve();
function render() { return renderChain = renderChain.then(doRender, doRender); }
async function doRender() {
  say(flash && flash.text, flash ? flash.kind : undefined);
  flash = null;
  setTitle('');
  const { parts, params } = route();
  try {
    if (!categories.length) await refreshNav();
    if (parts[0] === 'list') await showList(params);
    else if (parts[0] === 'p' && parts[1]) await showProduct(parts[1]);
    else if (parts[0] === 'cart') await showCart();
    else if (parts[0] === 'checkout') await showCheckout();
    else if (parts[0] === 'orders') await (parts[1] ? showOrder(parts[1]) : showOrders());
    else if (parts[0] === 'login' || parts[0] === 'signup') showAuth(parts[0]);
    else if (parts[0] === 'assistant') await showAssistantLog();
    else await showHome();
  } catch (e) {
    if (e.status === 401) { flash = { text: 'Your session has ended. Please log in again.', kind: 'error' }; go('#/login'); }
    else { view.innerHTML = ''; say(e.message); }
  }
  await refreshNav();
}

async function act(fn, success) {
  try { const outcome = await fn(); if (success && outcome !== 'handled') say(success, 'success'); }
  catch (e) {
    if (e.expired) { flash = { text: 'Your session has ended. Please log in again.', kind: 'error' }; go('#/login'); }
    else say(e.message);
  }
}

document.addEventListener('click', e => {
  const b = e.target.closest('[data-action]');
  if (!b || b.tagName === 'INPUT') return;
  const id = Number(b.dataset.id);
  const a = b.dataset.action;
  if (a === 'filters-toggle') { const f = $('#filters'); filtersOpen = f.classList.contains('closed'); f.classList.toggle('closed', !filtersOpen); }
  else if (a === 'price') {   // quick price button: fill the range and apply; clicking the active one clears it
    const f = $('#filters'), on = b.classList.contains('on');
    f.elements.min_price.value = on ? '' : b.dataset.min;
    f.elements.max_price.value = on ? '' : b.dataset.max;
    f.requestSubmit();
  }
  else if (a === 'co-step') { if (co) { co.step = Number(b.dataset.step); render(); } }
  else if (a === 'chat-toggle') {
    const open = $('#chat').hidden;
    $('#chat').hidden = !open; $('#chat-fab').hidden = open;
    if (open) $('[data-testid=chat-input]').focus();
  }
  else if (a === 'chat-new') chatReset();
  else if (a === 'toggle-pw') {
    const input = b.parentElement.querySelector('input');
    const show = input.type === 'password';
    input.type = show ? 'text' : 'password';
    b.innerHTML = svg(show ? 'eyeoff' : 'eye', 20, 1.8);
    b.setAttribute('aria-label', show ? 'Hide password' : 'Show password');
  }
  else if (a === 'scroll') {
    const t = $(b.dataset.target);
    const step = t.id === 'banner-track' ? t.firstElementChild.offsetWidth + 18 : t.clientWidth * 0.8;
    t.scrollBy({ left: Number(b.dataset.dir) * step, behavior: 'smooth' });
  }
  else if (a === 'dot') {
    const t = $('#banner-track');
    t.scrollTo({ left: Number(b.dataset.i) * (t.firstElementChild.offsetWidth + 18), behavior: 'smooth' });
  }
  else if (a === 'logout') {
    // Forget the session here straight away, and end it on the server too.
    const token = store.token;
    store.save(null, null); setCoupon(null); co = null; chatReset(); go('#/');
    if (token) fetch(BASE + '/auth/logout', { method: 'POST', headers: { Authorization: 'Bearer ' + token } }).catch(() => {});
  }
  else if (a === 'add' || a === 'add-detail') {
    if (needLogin()) return;
    const qty = a === 'add-detail' ? $('#detail-qty') : null;
    const quantity = qty ? Number(qty.value) : 1;
    if (qty) { const msg = qtyMessage(qty.value); fieldError(qty, msg); if (msg) { qty.focus(); return; } }
    act(async () => {
      try { await api('POST', '/cart/items', { product_id: id, quantity }); }
      catch (err) { if (!qty || err.status !== 409) throw err; fieldError(qty, err.message); return 'handled'; }
      await refreshNav();
    }, 'Added to cart.');
  }
  else if (a === 'remove') act(async () => { await api('DELETE', '/cart/items/' + id); await render(); });
  else if (a === 'coupon-remove') { setCoupon(null); render(); }
  else if (a === 'cancel') act(async () => { await api('POST', `/orders/${id}/cancel`); flash = { text: 'Order cancelled.', kind: 'success' }; await render(); });
});

    password: v => !v ? 'Create a password' : v.length < 8 ? 'Password must be at least 8 characters'
      : !v.trim() ? 'Password cannot be only spaces' : v.length > 100 ? 'Password can be at most 100 characters' : '',
    confirm: (v, f) => !v ? 'Enter your password again' : v !== f.password.value ? 'Passwords do not match' : '',
  },
  'ship-form': {
    email: emailRule,
    full_name: v => !v.trim() ? 'Enter your full name' : v.length > 100 ? 'Name can be at most 100 characters' : '',
    line1: v => !v.trim() ? 'Enter your house number and street' : v.length > 200 ? 'Address can be at most 200 characters' : '',
    line2: v => v.length > 200 ? 'Address can be at most 200 characters' : '',
    city: v => !v.trim() ? 'Enter your city' : v.length > 100 ? 'City can be at most 100 characters' : '',
    state: required('Select your state'),
    postal_code: v => !v.trim() ? 'Enter your PIN code' : !/^\d+$/.test(v.trim()) ? 'PIN code can contain digits only'
      : !/^[1-9][0-9]{5}$/.test(v.trim()) ? 'Enter a valid 6-digit PIN code' : '',
  },
  'pay-form': {
    card: v => { const d = v.replace(/\s+/g, ''); return !d ? 'Enter your card number' : !/^[0-9]+$/.test(d) ? 'Card number can contain digits only'
      : d.length !== 16 ? `Card number must be 16 digits (you entered ${d.length})` : ''; },
  },
  'coupon-form': { code: required('Enter a coupon code') },
  'filters': {
    min_price: priceRule,
    max_price: (v, f) => priceRule(v) || (v.trim() && /^\d+$/.test(f.min_price.value.trim()) && Number(v) < Number(f.min_price.value)
      ? 'Maximum price cannot be less than the minimum price' : ''),
  },
};
function qtyMessage(value) {
  const n = Number(value);
  return String(value).trim() === '' ? 'Enter a quantity' : !Number.isInteger(n) ? 'Quantity must be a whole number' : n < 1 ? 'Quantity must be at least 1' : '';
}
// Show (or with an empty message, remove) the error under one field.
function fieldError(input, msg) {
  if (!input) return;
  const host = input.closest('[data-err-host]') || input.closest('label') || input.parentElement;
  const key = input.dataset.testid || input.name;
  let el = [...host.querySelectorAll('.ferr')].find(x => x.dataset.for === key);
  const boxed = input.closest('.field, .fbox');
  if (!msg) {
    if (el) el.remove();
    input.removeAttribute('aria-invalid'); input.removeAttribute('aria-describedby');
    input.classList.remove('invalid'); if (boxed) boxed.classList.remove('invalid');
    return;
  }
  if (!el) {
    el = document.createElement('span');
    el.className = 'ferr'; el.dataset.for = key; el.dataset.testid = 'error-' + key; el.id = 'err-' + key;
    el.setAttribute('role', 'alert');
    host.appendChild(el);
  }
  el.textContent = msg;
  input.setAttribute('aria-invalid', 'true'); input.setAttribute('aria-describedby', el.id);
  input.classList.add('invalid'); if (boxed) boxed.classList.add('invalid');
}
function checkField(input) {
  const rule = input.form && RULES[input.form.id] && RULES[input.form.id][input.name];
  if (!rule) return true;
  const msg = rule(input.value, input.form.elements);
  fieldError(input, msg);
  return !msg;
}
// Check every field of a form, show all the errors at once and put the cursor in the first wrong field.
function validateForm(form) {
  form.dataset.tried = '1';
  const bad = Object.keys(RULES[form.id] || {}).map(name => form.elements[name]).filter(input => input && !checkField(input));
  if (bad.length) bad[0].focus();
  return !bad.length;
}
// A field is checked when the customer leaves it, and re-checked while they correct it.
// While a mouse button or finger is down, the check waits until it is released. Otherwise a message appearing
// under the field would push the button the customer is pressing out from under the pointer, and the click would be lost.
let pressing = false;
const waiting = new Set();
document.addEventListener('pointerdown', () => { pressing = true; }, true);
document.addEventListener('pointerup', () => {
  pressing = false;
  setTimeout(() => { waiting.forEach(t => { if (document.contains(t)) checkField(t); }); waiting.clear(); }, 0);
}, true);
document.addEventListener('focusout', e => {
  const t = e.target;
  if (!(t.form && RULES[t.form.id] && RULES[t.form.id][t.name] && (t.value !== '' || t.form.dataset.tried))) return;
  if (pressing) waiting.add(t); else checkField(t);
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'register-password') drawStrength(t.value);
  if (t.getAttribute('aria-invalid')) {
    if (t.form && RULES[t.form.id] && RULES[t.form.id][t.name]) checkField(t); else fieldError(t, '');
  }
  if (t.form && t.form.id === 'register-form' && t.name === 'password' && t.form.elements.confirm.value) checkField(t.form.elements.confirm);
  if (t.form && t.form.id === 'filters' && t.name === 'min_price' && t.form.elements.max_price.getAttribute('aria-invalid')) checkField(t.form.elements.max_price);
});

document.addEventListener('change', e => {
  if (e.target.matches('select[data-auto]')) { e.target.form.requestSubmit(); return; }   // dropdown filters apply straight away
  if (e.target.dataset.action !== 'qty') return;
  const input = e.target, id = input.dataset.id;
  // On a wrong quantity the field goes back to the saved value and says why, without redrawing the page.
  const refuse = msg => { input.value = input.dataset.prev; fieldError(input, msg); };
  const msg = qtyMessage(input.value);
  if (msg) { refuse(msg); return; }
  api('PUT', '/cart/items/' + id, { quantity: Number(input.value) }).then(() => render()).catch(err => {
    if (err.expired) { flash = { text: 'Your session has ended. Please log in again.', kind: 'error' }; go('#/login'); } else refuse(err.message);
  });
});

document.addEventListener('submit', e => {
  e.preventDefault();
  const form = e.target, f = Object.fromEntries(new FormData(form)), id = form.id;
  if (id === 'chat-form') chatSend(f.message, form);
  else if (id === 'search-form' || id === 'filters') {
    if (id === 'filters' && !validateForm(form)) return;
    const p = new URLSearchParams();
    for (const [k, v] of Object.entries(f)) if (String(v).trim() !== '') p.set(k, String(v).trim());
    go('#/list' + (p.toString() ? '?' + p : ''));
    if (id === 'search-form') { form.reset(); closeSuggest(); }
  }
  else if (id === 'login-form' || id === 'register-form') {
    if (!validateForm(form)) return;
    act(async () => {
      const email = f.email.trim();
      let r;
      try {
        r = id === 'login-form' ? await api('POST', '/auth/login', { email, password: f.password })
                                : await api('POST', '/auth/register', { name: f.name, email, password: f.password });
      } catch (err) {
        // Answers from the server that belong to one field are shown at that field.
        if (err.status === 401) { fieldError(form.elements.password, err.message); form.elements.password.focus(); return; }
        if (err.status === 409) { fieldError(form.elements.email, 'This email is already registered. Log in instead'); form.elements.email.focus(); return; }
        throw err;
      }
      store.save(r.token, r.user.name, id === 'register-form' || !!f.remember);
      const back = returnTo && !/^#\/(login|signup)/.test(returnTo) ? returnTo : '#/';
      returnTo = null;
      go(back);
    });
  }
  else if (id === 'coupon-form') {
    if (!validateForm(form)) return;
    act(async () => {
      let r;
      try { r = await api('POST', '/coupons/validate', { code: f.code }); }
      catch (err) { if (err.status !== 400) throw err; fieldError(form.elements.code, err.message); return; }
      setCoupon(r.code); flash = { text: `Coupon ${r.code} applied.`, kind: 'success' }; await render();
    });
  }
  else if (id === 'ship-form') {
    const ship = {};
    for (const k of SHIP_FIELDS) ship[k] = String(f[k] || '').trim();
    co.shipping = ship; co.save = !!f.save;   // keep what was typed, even when a field is wrong
    if (!validateForm(form)) return;
    co.step = 2;
    render();
  }
  else if (id === 'pay-form') {
    co.card = String(f.card || '').replace(/\s+/g, '');
    if (!validateForm(form)) return;
    co.step = 3;
    render();
  }
  else if (id === 'review-form') act(async () => {
    const body = { card_number: co.card, shipping: co.shipping };
    if (appliedCoupon) body.coupon_code = appliedCoupon;
    let o;
    try { o = await api('POST', '/checkout', body); }
    catch (e) {
      if (e.status !== 402) throw e;
      co.step = 2; co.cardError = 'Payment declined. Try another card'; await render(); return;
    }
    savedAddress(co.key, co.save ? co.shipping : null);
    co = null;
    setCoupon(null);
    flash = { text: 'Order placed.', kind: 'success' };
    go('#/orders/' + o.id);
  });
});

window.addEventListener('hashchange', () => { closeSuggest(); render(); });
render();
</script>
</body>
</html>
